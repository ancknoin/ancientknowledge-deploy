name: Sync & Deploy

on:
  # schedule:
  #   - cron: "30 0 * * *" # 06:00 IST daily
  # Commented out 2026-08-27 - deploys are being triggered manually for now.
  workflow_dispatch:
    inputs:
      skip_cms_sync:
        description: "Skip CMS sync (build & deploy existing content only)"
        type: boolean
        default: false
      cms_sync_scope:
        description: "Limit sync to these work slugs, comma-separated (e.g. hanuman-chalisa,ganesh-chalisa). Empty = full sync."
        type: string
        default: ""
      since_hours:
        description: "Only sync works with a page edited in the last N hours (e.g. 24, 168). Empty = full sync. Mutually exclusive with cms_sync_scope."
        type: string
        default: "24"
      deploy:
        description: "Build and deploy the site"
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.163.3"

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.AK_MAIN_REPO_PAT }}

      - name: Set up Go
        if: ${{ !inputs.skip_cms_sync || github.event_name != 'workflow_dispatch' || inputs.deploy }}
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/notion-sync/go.mod
          cache-dependency-path: tools/notion-sync/go.sum

      - name: Export content
        if: ${{ !inputs.skip_cms_sync }}
        working-directory: tools/notion-sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKS_REGISTRY_ID: ${{ secrets.NOTION_WORKS_REGISTRY_ID }}
          NOTION_TAXONOMY_ID: ${{ secrets.NOTION_TAXONOMY_ID }}
          SYNC_SCOPE: ${{ inputs.cms_sync_scope }}
          SINCE_HOURS: ${{ github.event_name == 'schedule' && '24' || inputs.since_hours }}
        run: |
          set -o pipefail
          if [ -n "$SINCE_HOURS" ] && [ -n "$SYNC_SCOPE" ]; then
            echo "cms_sync_scope and since_hours are mutually exclusive -- set only one." >&2
            exit 1
          fi
          if [ -n "$SINCE_HOURS" ]; then
            go run ./cmd/notion-sync export -out ../../content -since "${SINCE_HOURS}h" -v 2>&1 | tee /tmp/export.log
          else
            go run ./cmd/notion-sync export -out ../../content -only "$SYNC_SCOPE" -v 2>&1 | tee /tmp/export.log
          fi
          {
            echo "## Notion sync"
            echo '```'
            grep -E "starting (incremental|scoped|full) export|no pages edited in window|incremental export scoped|export complete" /tmp/export.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep deleted content
        if: ${{ !inputs.skip_cms_sync }}
        working-directory: tools/notion-sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -o pipefail
          go run ./cmd/notion-sync sweep -content ../../content -delete -v 2>&1 | tee /tmp/sweep.log
          {
            echo "## Deletion sweep"
            echo '```'
            grep -E "^sweep:|^  \[|orphan\(s\)|^removed |Nothing to do" /tmp/sweep.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Content diff
        if: ${{ !inputs.skip_cms_sync }}
        run: |
          {
            echo "## Content changed this run"
          } >> "$GITHUB_STEP_SUMMARY"
          CHANGED=$(git status --porcelain=v1 -- content data)
          if [ -z "$CHANGED" ]; then
            echo "None." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '```'
              echo "$CHANGED"
              echo '```'
              echo "Candidate pages (pre-build; the actual R2 upload set is decided by content hash at deploy time, not this list):"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$CHANGED" | cut -c4- | grep '^content/' | while IFS= read -r p; do
              rel="${p#content/}"
              rel="${rel%/_index.md}"
              rel="${rel%/index.md}"
              echo "/${rel}/"
            done >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push synced content
        if: ${{ !inputs.skip_cms_sync }}
        run: |
          git config user.name "notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add content data
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "content: sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Generate llms.txt
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        working-directory: tools/notion-sync
        run: go run ./cmd/gen-llms-txt

      - name: Generate search index
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        working-directory: tools/notion-sync
        run: go run ./cmd/gen-search-index

      - name: Generate leaf nav
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        working-directory: tools/notion-sync
        run: go run ./cmd/gen-leaf-nav

      - name: Install Hugo
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: hugo --gc --minify --environment production

      - name: Deploy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}
        run: |
          set -o pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone sync public/ "r2:${{ secrets.R2_BUCKET }}" \
            --checksum --fast-list \
            --transfers 32 --checkers 32 \
            --retries 5 --low-level-retries 20 --retries-sleep 10s \
            --header-upload "Cache-Control: public, max-age=3600, stale-while-revalidate=86400" \
            -v --stats-one-line 2>&1 | tee /tmp/rclone.log
          {
            echo "## Deployed to R2"
            CHANGED_R2=$(grep -E ': (Copied|Deleted)' /tmp/rclone.log || true)
            if [ -z "$CHANGED_R2" ]; then
              echo "No files changed."
            else
              echo '```'
              echo "$CHANGED_R2"
              echo '```'
            fi
            echo '```'
            grep -E '^Transferred:|^Checks:|^Deleted:|^Elapsed' /tmp/rclone.log || tail -n1 /tmp/rclone.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Purge cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
